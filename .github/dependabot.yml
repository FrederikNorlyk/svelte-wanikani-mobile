version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '06:00'

    cooldown:
      default-days: 7

    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

    groups:
      all:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      # Check for updates to GitHub Actions every week
      interval: 'weekly'
      day: 'saturday'
      time: '06:00'

    cooldown:
      default-days: 7
